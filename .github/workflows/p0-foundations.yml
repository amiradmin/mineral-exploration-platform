name: P0 foundation checks

on:
  push:
    branches: [main, "feat/p0-postgres-security-gates"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: data_mine
          POSTGRES_USER: data_mine
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_mine -d data_mine"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-key-not-for-production
      DB_ENGINE: postgresql
      POSTGRES_DB: data_mine
      POSTGRES_USER: data_mine
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test exploration --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
