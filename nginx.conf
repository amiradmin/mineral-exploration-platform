server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location /api/ {
   proxy_pass http://api:8000;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
 }
 # Django admin is a backend application, not a React route.
 location /admin/ {
   proxy_pass http://api:8000;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
 }
 # WhiteNoise serves Django's collected admin CSS, JS and image assets.
 # Keep this separate from Vite's bundled /assets/ directory.
 location /static/ {
   proxy_pass http://api:8000;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
 }
 location = /admin { return 301 /admin/; }
 location / { try_files $uri $uri/ /index.html; }
}
